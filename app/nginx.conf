# Add this line at the very top to prevent root permission errors
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Include standard mime types so CSS/JS load correctly
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 8080;

        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        error_page 404 /404.html;

        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}