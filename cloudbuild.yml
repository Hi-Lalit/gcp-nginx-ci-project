steps:

# Step 1: Run Trivy filesystem scan on the raw codebase before building the image
- name: 'docker.io/aquasec/trivy:latest'
  id: 'trivy-fs-scan'
  entrypoint: 'sh'
  args:
    - '-c'
    - |
        set -e
        
        echo "----------------------------------------------------------------------------------------------------------"
        echo "Executing Pre-Build Filesystem Scan"
        echo "----------------------------------------------------------------------------------------------------------"
        
        # Scan the raw codebase inside Cloud Build's workspace directory
        trivy fs \
          --exit-code 1 \
          --severity HIGH,CRITICAL \
          --scanners vuln,misconfig,secret \
          --no-progress \
          /workspace

# Step 2: Run SonarQube analysis with /tmp fallback space to bypass root permission limits
- name: 'sonarsource/sonar-scanner-cli:latest'
  id: 'SonarQube analysis'
  entrypoint: 'bash'
  secretEnv: ['_SONAR_TOKEN']
  args:
    - '-c'
    - |
      set -e

      echo "----------------------------------------------------------------------------------------------------------"
      echo "Running SonarQube analysis using /tmp fallback space"
      echo "----------------------------------------------------------------------------------------------------------"

      # Pointing to /tmp completely bypasses the Cloud Build root permission limits
      sonar-scanner \
        -Dsonar.projectKey=${_SONAR_PROJECT_KEY} \
        -Dsonar.organization=${_SONAR_ORGANIZATION} \
        -Dsonar.sources=app \
        -Dsonar.host.url=${_SONAR_HOST_URL} \
        -Dsonar.token=$$_SONAR_TOKEN \
        -Dsonar.working.directory=/tmp/sonar-cache

# Step 3: Wait for SonarQube analysis to complete and check quality gate status using curl and jq
- name: 'alpine:latest'
  id: 'quality-gate'
  entrypoint: 'sh'
  secretEnv: ['_SONAR_TOKEN']
  args:
    - '-c'
    - |
        set -e

        apk add --no-cache curl jq

        echo "----------------------------------------------------------------------------------------------------------"
        echo "Checking SonarQube Quality Gate Status"
        echo "----------------------------------------------------------------------------------------------------------"

        MAX_WAIT=300
        WAITED=0

        while true; do
          STATUS=$(curl -s -u "$${_SONAR_TOKEN}:" \
            "${_SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${_SONAR_PROJECT_KEY}" \
            | jq -r '.projectStatus.status')

          echo "Current Quality Gate Status: $$STATUS"

          # Exit loop once SonarQube returns a final status
          if [ "$$STATUS" = "OK" ] || [ "$$STATUS" = "ERROR" ] || [ "$$STATUS" = "WARN" ]; then
            break
          fi

          if [ "$$WAITED" -ge "$$MAX_WAIT" ]; then
            echo "Timeout waiting for Quality Gate result"
            exit 1
          fi

          sleep 5
          WAITED=$$((WAITED + 5))
        done

        echo "Final Quality Gate Status: $$STATUS"

        if [ "$$STATUS" != "OK" ]; then
          echo "Quality Gate Failed"
          exit 1
        fi

        echo "Quality Gate Passed"

# Step 4: List all images currently in the repository and calculate the next semver tag
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Calculate semver tag'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      set -e

      echo "----------------------------------------------------------------------------------------------------------"
      echo "Calculating semantic version tag"
      echo "----------------------------------------------------------------------------------------------------------"

      # 1. List all images and tags in the repository and save to files
      gcloud artifacts docker images list ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY} \
        --format="value(format('{0}@{1}', package, version))" > /workspace/repo_image_list.txt

      gcloud artifacts docker tags list ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE} \
        --format="value(tag)" > /workspace/repo_image_tags.txt

      # 2. Load Repository image references and tags into variables for later use
      repo_image_list=$$(cat /workspace/repo_image_list.txt 2>/dev/null)
      repo_image_tag=$$(cat /workspace/repo_image_tags.txt 2>/dev/null)

      if [ -z "$$repo_image_list" ]; then
        echo "Images not found in the repository. This is the first image to build and push."
      else
        echo "Found images in the repository:"
        echo "List of images is: $$repo_image_list"
      fi

      # 3. Handle Semantic Versioning calculation
      # ✅ Print Cloud Build substitution value directly
      echo "Bump type: ${_VERSION_BUMP}"

      if [ -z "$$repo_image_tag" ]; then
          echo "No tags found. Starting semver chain at v1.0.0"
          echo "v1.0.0" > /workspace/tag.txt

      else
          # Filter only valid vX.Y.Z tags
          latest_tag=$$(echo "$$repo_image_tag" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$$' \
            | sed 's/^v//' \
            | sort -V \
            | tail -n 1)

          if [ -z "$$latest_tag" ]; then
              echo "No valid semver tags found. Starting at v1.0.0"
              echo "v1.0.0" > /workspace/tag.txt

          else
              echo "Latest tag found: v$$latest_tag"

              # Split into MAJOR MINOR PATCH — uppercase avoids reserved word conflict
              IFS='.' read -r MAJOR MINOR PATCH <<< "$$latest_tag"

              echo "Parsed → MAJOR=$$MAJOR MINOR=$$MINOR PATCH=$$PATCH"

              # ✅ Use Cloud Build substitution directly in case — no BUMP variable
              case "${_VERSION_BUMP}" in
                major)
                  updated_tag="v$$((MAJOR + 1)).0.0" ;;
                minor)
                  updated_tag="v$${MAJOR}.$$((MINOR + 1)).0" ;;
                patch|*)
                  updated_tag="v$${MAJOR}.$${MINOR}.$$((PATCH + 1))" ;;
              esac

              echo "Updated tag: $$updated_tag"
              echo "$$updated_tag" > /workspace/tag.txt
          fi
      fi

# Step 5: Build the image and save to a tarball (no push)
- name: 'gcr.io/kaniko-project/executor:debug'
  id: 'Build Docker image'
  entrypoint: 'sh'
  args:
    - '-c'
    - |
      set -e

      echo "----------------------------------------------------------------------------------------------------------"
      echo "Building the image with Kaniko and saving to tarball (no push)"
      echo "----------------------------------------------------------------------------------------------------------"
      TAG=$$(cat /workspace/tag.txt)

      BUILD_DATE=$$(date -u +"%Y-%m-%dT%H:%M:%SZ")

      /kaniko/executor --context=dir://app \
        --no-push \
        --tar-path=/workspace/image.tar \
        --destination=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$$TAG \
        --cache=true \
        --cache-ttl=168h \
        --cache-repo=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/cache \
        --reproducible=true \
        --label=build-date=$$BUILD_DATE 

# Step 6: Load image into Docker, extract RootFS layers, run tests
- name: 'gcr.io/cloud-builders/docker'
  id: 'Load & inspect Docker image'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      set -e

      TAG=$$(cat /workspace/tag.txt)

      echo "----------------------------------------------------------------------------------------------------------"
      echo "Loading the built image from tarball into Docker"
      echo "----------------------------------------------------------------------------------------------------------"
      docker load -i /workspace/image.tar

      apt-get update -qq && apt-get install -y -qq jq

      echo "Inspect the loaded image: ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$$TAG"

      docker inspect ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$$TAG

      echo "Inspecting the loaded image to extract RootFS layers and save to file"

      docker inspect ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$$TAG \
        | jq -r '.[] | .RootFS.Layers | join(" ")' > /workspace/new_rootfs.txt

      echo "New image RootFS layers:"
      cat /workspace/new_rootfs.txt

# Step 7: Scan the built image tarball directly with Trivy
- name: 'docker.io/aquasec/trivy:latest'
  id: 'trivy-security-scan-image'
  entrypoint: 'sh'
  args:
    - '-c'
    - |
      set -e

      echo "----------------------------------------------------------------------------------------------------------"
      echo "Scanning the built image tarball with Trivy for vulnerabilities"
      echo "----------------------------------------------------------------------------------------------------------"

      TAG=$$(cat /workspace/tag.txt)

      # Scan directly from the tarball — no registry pull needed, no Docker daemon needed
      trivy image \
        --input /workspace/image.tar \
        --exit-code 1 \
        --ignore-unfixed \
        --severity HIGH,CRITICAL \
        --scanners vuln \
        --format table \
        --output /workspace/trivy_image_report.txt \
        --no-progress

      echo "Trivy image scan passed for tag: $$TAG"
      cat /workspace/trivy_image_report.txt

# Step 8: Extract RootFS layers of existing repository images using crane
- name: 'gcr.io/go-containerregistry/crane:debug'
  id: 'Inspect RootFS layers of repository images'
  entrypoint: 'sh'
  args:
    - '-c'
    - |
      set -e

      echo "----------------------------------------------------------------------------------------------------------"
      echo "Extracting RootFS layers of repository images"
      echo "----------------------------------------------------------------------------------------------------------"
            
      touch /workspace/repo_rootfs.txt

      if [ ! -s /workspace/repo_image_list.txt ]; then
        echo "repo_image_list.txt is empty. Skipping layer extraction."
      else
        while IFS= read -r image_ref; do
          [ -z "$$image_ref" ] && continue

          echo "Inspecting image: $$image_ref"

          raw=$$(crane config "$$image_ref") || {
            echo "WARNING: crane config failed for $$image_ref" >&2
            continue
          }

          layers=$$(echo "$$raw" \
            | grep -o '"diff_ids":\[[^]]*\]' \
            | grep -o '"sha256:[a-f0-9]*"' \
            | tr -d '"' \
            | tr '\n' ' ' \
            | xargs)

          if [ -z "$$layers" ]; then
            echo "WARNING: No layers found for $$image_ref" >&2
            continue
          fi

          echo "  -> Layers: $$layers"
          echo "$$layers" >> /workspace/repo_rootfs.txt

        done < /workspace/repo_image_list.txt

        echo "RootFS layers of repository images:"
        cat /workspace/repo_rootfs.txt
      fi

# Step 9: Compare RootFS layers and conditionally push
- name: 'gcr.io/cloud-builders/docker'
  id: 'Conditional push'  
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      set -e

      echo "----------------------------------------------------------------------------------------------------------"
      echo "Comparing RootFS layers of new image with existing repository images"
      echo "----------------------------------------------------------------------------------------------------------"

      # Load variables

      NEW_TAG=$$(cat /workspace/tag.txt)
      NEW_ROOTFS=$$(cat /workspace/new_rootfs.txt)
      REPO_ROOTFS="/workspace/repo_rootfs.txt"
      FULL_IMAGE_NAME="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:$$NEW_TAG"
      
      # 1. Validate that the new RootFS data is not empty before proceeding
      if [[ -z "$$NEW_ROOTFS" ]]; then
        echo "ERROR: $$FULL_IMAGE_NAME has an empty RootFS or may be not built." >&2
        exit 1
      fi

      if [[ ! -s "$$REPO_ROOTFS" ]]; then
        echo "WARNING: repo_rootfs.txt is empty or missing. No existing images to compare against." >&2
        echo "Proceeding to push the new image without comparison."
        docker push "$$FULL_IMAGE_NAME"
        echo "pushed" > /workspace/push_status.txt
        exit 0
      fi
      
      # 2. Compare the full layer chain as a single exact line against the repo history
      if grep -Fxq "$$NEW_ROOTFS" "$$REPO_ROOTFS"; then
        echo "MATCH FOUND: An image with this exact layer combination already exists."
        echo "Action: Skipping push for $$NEW_TAG."
        echo "skipped" > /workspace/push_status.txt
      else
        echo "NO MATCH: Unique layer combination detected."
        echo "Action: Pushing $$FULL_IMAGE_NAME"

        docker push "$$FULL_IMAGE_NAME"
        echo "pushed" > /workspace/push_status.txt
      fi

# Step 10: Generate and upload SBOM after push
- name: 'docker.io/aquasec/trivy:latest'
  id: 'Generate SBOM'
  entrypoint: 'sh'
  args:
    - '-c'
    - |
      set -e

      echo "----------------------------------------------------------------------------------------------------------"
      echo "Generating SBOM for the built image"
      echo "----------------------------------------------------------------------------------------------------------"

      PUSH_STATUS=$$(cat /workspace/push_status.txt 2>/dev/null)

      if [ "$$PUSH_STATUS" = "skipped" ]; then
        echo "Image was not pushed (duplicate). Skipping SBOM generation."
        exit 0
      fi

      TAG=$$(cat /workspace/tag.txt)
      IMAGE_REF=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$$TAG

      # Generate SBOM in CycloneDX JSON format
      trivy image \
        --format cyclonedx \
        --output /workspace/sbom.json \
        --no-progress \
        "$$IMAGE_REF"

      echo "SBOM generated successfully"
      cat /workspace/sbom.json

# Step 11: Upload SBOM to GCS bucket under versioned path
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Upload SBOM'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      set -e

      PUSH_STATUS=$$(cat /workspace/push_status.txt 2>/dev/null)

      if [ "$$PUSH_STATUS" = "skipped" ]; then
        echo "Image was not pushed. Skipping SBOM upload."
        exit 0
      fi

      TAG=$$(cat /workspace/tag.txt)

      echo "----------------------------------------------------------------------------------------------------------"
      echo "Uploading SBOM to GCS"
      echo "----------------------------------------------------------------------------------------------------------"

      # Upload SBOM to GCS bucket under versioned path
      gsutil cp /workspace/sbom.json \
        gs://${_LOG_BUCKET}/sbom/$$TAG/sbom.json

      echo "SBOM uploaded to gs://${_LOG_BUCKET}/sbom/$$TAG/sbom.json"

